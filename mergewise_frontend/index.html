<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Mergewise scores every pull request by risk, so review time goes where it matters." />

    <!-- Link previews (LinkedIn, X, Slack, WhatsApp…). Crawlers need absolute
         URLs, so these point at the production site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mergewise" />
    <meta property="og:url" content="https://www.mergewise.in/" />
    <meta property="og:title" content="Mergewise: review what matters, skim the rest" />
    <meta property="og:description" content="Every pull request scored 0–100 for review risk, with every point explained. Read-only GitHub App; your code is never stored." />
    <meta property="og:image" content="https://www.mergewise.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mergewise logo with the line: review what matters, skim the rest" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mergewise: review what matters, skim the rest" />
    <meta name="twitter:description" content="Every pull request scored 0–100 for review risk, with every point explained." />
    <meta name="twitter:image" content="https://www.mergewise.in/og-image.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Mergewise: review what matters, skim the rest</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.tsx).
      try {
        var theme = localStorage.getItem("devpulse:theme") || localStorage.getItem("devpulse:public-theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-white font-sans text-slate-900 antialiased dark:bg-canvas dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
